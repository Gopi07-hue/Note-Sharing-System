<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
content="width=device-width,initial-scale=1.0">
<title>Cloud Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: auth split screen, then a navy sidebar + topbar + content shell. Mobile turns the sidebar into a drawer. */
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F2F5FB; --surface:#FFFFFF; --surface-2:#F6F8FD; --line:#E2E8F3;
  --fg:#14203B; --muted:#5F6C88;
  --brand:#2B5FE0; --brand-ink:#FFFFFF; --brand-soft:#E7EEFE; --link:#2455D4;
  --nav:#162247; --nav-fg:#B9C4E4; --nav-hover:rgba(255,255,255,.08);
  --danger:#C23B3B; --danger-soft:#FCE9E9; --fav:#E5484D; --ok:#1E8E5F;
  --shadow:0 1px 2px rgba(20,32,59,.05),0 8px 24px rgba(20,32,59,.06);
  --panel-1:#3B74F2; --panel-2:#2350D2; --band:var(--surface);
  --c1-bg:#E4ECFF; --c1-fg:#2450C8; --c1-solid:#3B6FF0;
  --c2-bg:#EFE6FF; --c2-fg:#6A3FC2; --c2-solid:#8B5CF6;
  --c3-bg:#FFEBD9; --c3-fg:#A9530A; --c3-solid:#F59A3B;
  --c4-bg:#DDF5E8; --c4-fg:#17754F; --c4-solid:#2EB67D;
  --c5-bg:#D9F3F5; --c5-fg:#0F6F78; --c5-solid:#1BA3AE;
  --c6-bg:#FFE3EC; --c6-fg:#B3345E; --c6-solid:#E5527F;
  --c7-bg:#E9ECF3; --c7-fg:#4A5670; --c7-solid:#6B7894;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220; --surface:#141C30; --surface-2:#19233B; --line:#26314C;
    --fg:#E7ECF8; --muted:#9AA6C3;
    --brand:#3E6DE8; --brand-ink:#FFFFFF; --brand-soft:#1B2A52; --link:#8FB0FF;
    --nav:#0A1020; --nav-fg:#AEB9DA; --nav-hover:rgba(255,255,255,.07);
    --danger:#F08080; --danger-soft:#3A1E24; --fav:#FF6B70; --ok:#4FD6A0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --panel-1:#2D58C8; --panel-2:#1B3A9A;
    --c1-bg:#1E2D55; --c1-fg:#9DB8FF; --c2-bg:#2D2250; --c2-fg:#C3A8FF;
    --c3-bg:#3B2A18; --c3-fg:#FFB979; --c4-bg:#15352B; --c4-fg:#6FD9A6;
    --c5-bg:#123438; --c5-fg:#6ED3DC; --c6-bg:#3B1D2A; --c6-fg:#FF9DB9;
    --c7-bg:#252D40; --c7-fg:#B3BDD6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#141C30; --surface-2:#19233B; --line:#26314C;
  --fg:#E7ECF8; --muted:#9AA6C3;
  --brand:#3E6DE8; --brand-ink:#FFFFFF; --brand-soft:#1B2A52; --link:#8FB0FF;
  --nav:#0A1020; --nav-fg:#AEB9DA; --nav-hover:rgba(255,255,255,.07);
  --danger:#F08080; --danger-soft:#3A1E24; --fav:#FF6B70; --ok:#4FD6A0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --panel-1:#2D58C8; --panel-2:#1B3A9A;
  --c1-bg:#1E2D55; --c1-fg:#9DB8FF; --c2-bg:#2D2250; --c2-fg:#C3A8FF;
  --c3-bg:#3B2A18; --c3-fg:#FFB979; --c4-bg:#15352B; --c4-fg:#6FD9A6;
  --c5-bg:#123438; --c5-fg:#6ED3DC; --c6-bg:#3B1D2A; --c6-fg:#FF9DB9;
  --c7-bg:#252D40; --c7-fg:#B3BDD6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.in-auth{--band:var(--panel-1)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}

/* shared controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand);filter:brightness(1.08)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger);filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--link);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn.fav{color:var(--fav)}
.iconbtn.fav svg{fill:currentColor}
.label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.label .req{color:var(--danger)}
.input,.select,.textarea{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg)}
.input::placeholder,.textarea::placeholder{color:var(--muted);opacity:.8}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--link);outline-offset:0;border-color:transparent}
.textarea{min-height:170px;resize:vertical;line-height:1.55}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
.field{display:flex;flex-direction:column;min-width:0}
.field-msg{color:var(--danger);font-size:12.5px;margin-top:5px;min-height:0}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap>svg{position:absolute;left:12px;color:var(--muted);pointer-events:none}
.input-wrap .input{padding-left:38px}
.input-wrap .trail{position:absolute;right:4px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.7;white-space:nowrap}
.c1.pill{background:var(--c1-bg);color:var(--c1-fg)}.c2.pill{background:var(--c2-bg);color:var(--c2-fg)}
.c3.pill{background:var(--c3-bg);color:var(--c3-fg)}.c4.pill{background:var(--c4-bg);color:var(--c4-fg)}
.c5.pill{background:var(--c5-bg);color:var(--c5-fg)}.c6.pill{background:var(--c6-bg);color:var(--c6-fg)}
.c7.pill{background:var(--c7-bg);color:var(--c7-fg)}
.c1.tile{background:var(--c1-solid)}.c2.tile{background:var(--c2-solid)}.c3.tile{background:var(--c3-solid)}
.c4.tile{background:var(--c4-solid)}.c5.tile{background:var(--c5-solid)}.c6.tile{background:var(--c6-solid)}.c7.tile{background:var(--c7-solid)}
.switch{position:relative;width:44px;height:26px;border-radius:999px;border:0;background:var(--line);padding:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:min(92vw,460px);box-shadow:var(--shadow)}

/* auth */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100%}
.auth-brand{background:linear-gradient(160deg,var(--panel-1),var(--panel-2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px}
.auth-brand .logo{width:84px;height:84px}
.auth-brand h1{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.auth-brand .subtitle{font-size:20px;font-weight:500;opacity:.95}
.auth-brand .tagline{margin-top:6px;font-weight:500;opacity:.9;letter-spacing:.02em}
.illus{width:min(340px,80%);margin-top:28px;height:auto}
.auth-side{display:flex;align-items:center;justify-content:center;background:var(--surface);padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:6px}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 0;font-weight:700;font-size:16px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--link);border-bottom-color:var(--link)}
.auth-card h2{font-size:20px;font-weight:700}
.form-msg{padding:9px 12px;border-radius:9px;background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:500}
.form-msg.ok{background:var(--brand-soft);color:var(--link)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gmark{font-weight:800;font-size:17px;color:#4285F4;width:20px;text-align:center}
.hint{color:var(--muted);font-size:12.5px;text-align:center}
.center{text-align:center}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;align-self:start;height:100dvh;background:var(--nav);color:var(--nav-fg);display:flex;flex-direction:column;gap:4px;padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;z-index:30}
.brandrow{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;color:#fff;font-weight:800;font-size:17px}
.brandrow svg{color:#7FA2FF}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:9px;border:0;background:transparent;color:var(--nav-fg);font-weight:600;font-size:14px;text-align:left}
.nav-btn:hover{background:var(--nav-hover);color:#fff}
.nav-btn[aria-current="page"]{background:var(--brand);color:#fff}
.spacer{flex:1}
.scrim{display:none}
.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu-btn{display:none}
.search{position:relative;flex:1;max-width:340px;margin-left:auto}
.search .input{min-height:38px;padding-left:36px;padding-right:34px;border-radius:999px;background:var(--surface-2)}
.search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .iconbtn{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:30px;height:30px}
.avatar{width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:13px;flex:none}
.content{width:100%;max-width:980px;margin:0 auto;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:flex;flex-direction:column;gap:18px}
.greet{font-size:26px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:-12px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:800}
.page-head p{color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--link)}
.stat .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.stat .lbl{color:var(--muted);font-size:13px;font-weight:500}
.stat .num{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat.s-blue .ico{background:var(--c1-bg);color:var(--c1-fg)}
.stat.s-green .ico{background:var(--c4-bg);color:var(--c4-fg)}
.stat.s-red .ico{background:var(--c6-bg);color:var(--c6-fg)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.sec-head h2{font-size:16px;font-weight:700}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:4px;padding-right:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 8px 14px 16px;background:none;border:0;text-align:left}
.tile{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.row-title{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.row-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;color:var(--muted);font-size:12.5px}
.row-date{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.d-narrow{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:28px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.empty h3{font-size:16px;font-weight:700}
.empty p{color:var(--muted);max-width:52ch}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(43,95,224,.4);z-index:20}

/* panels and forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow)}
.card + .card{margin-top:0}
.stack{display:flex;flex-direction:column;gap:16px}
.form-card{max-width:720px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:6px}
.switch-row span{font-weight:600}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.counter{align-self:flex-end;color:var(--muted);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.note-bar{display:flex;align-items:center;gap:6px}
.note-bar .back{margin-right:auto;display:inline-flex;align-items:center;gap:8px;background:none;border:0;font-weight:600;color:var(--muted);padding:6px 4px}
.note-bar .back:hover{color:var(--fg)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:38px;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:8}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:7px;text-align:left;font-weight:600}
.menu button:hover{background:var(--surface-2)}
.menu .danger{color:var(--danger)}
.note-title{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:10px 0 8px;overflow-wrap:anywhere}
.note-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.note-meta span{display:inline-flex;align-items:center;gap:6px}
.note-body{margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;max-width:70ch}
.confirm{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-weight:600;margin-top:14px}
.confirm .actions{margin-left:auto}
.share h3{font-size:15px;font-weight:700;margin-bottom:10px}
.share .line{display:flex;gap:10px}
.share .line .input{min-width:0}
.share-note{color:var(--muted);font-size:13px;margin-bottom:10px}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.person{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 12px;border-radius:999px;background:var(--brand-soft);color:var(--link);font-weight:600;font-size:12.5px}
.person .iconbtn{width:24px;height:24px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.settings-row + .settings-row{margin-top:14px}
.settings-row>div{min-width:0}
.settings-row p{color:var(--muted);font-size:13px}
.settings-row .select{width:auto;min-width:150px}

@media (max-width:820px){
  .auth{grid-template-columns:1fr}
  .auth-brand{padding-block:26px;padding-right:max(24px,env(safe-area-inset-right,0px))}
  .auth-brand .logo{width:54px;height:54px}
  .auth-brand h1{font-size:28px;margin-top:2px}
  .auth-brand .subtitle{font-size:16px}
  .illus{display:none}
  .auth-side{align-items:flex-start;padding-left:max(24px,env(safe-area-inset-left,0px))}
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .nav-open .sidebar{transform:none}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:25}
  .menu-btn{display:inline-grid}
  .search{max-width:none;margin-left:0}
  .stats{gap:10px}
  .stat{padding:12px}
  .stat .num{font-size:22px}
  .d-wide{display:none}
  .d-narrow{display:inline}
  .row-main{grid-template-columns:auto minmax(0,1fr);padding-left:12px}
  .greet{font-size:22px}
  .note-title{font-size:22px}
}
@media (max-width:480px){
  .share .line{flex-direction:column}
  .card{padding:16px}
  .stat .lbl{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .sidebar,.switch,.switch::after{transition:none}
}
</style>
</head>

      if (view.name !== 'search') { stack.push(view); view = { name: 'search', q: q }; }
      else view.q = q;
      menuOpen = false; confirmDelete = false;
      paint(false);
    } else if (view.name === 'search') {
      back();
    }
  }
  function logout() {
    session = null; store('cn_session', null);
    stack = []; view = { name: 'dashboard' };
    closeNav();
    render();
  }
  function paint(scroll) {
    if (!content) return;
    var key = navKey();
    sidebarEl.querySelectorAll('[data-nav]').forEach(function (b) {
      if (b.getAttribute('data-nav') === key) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    fab.hidden = ['dashboard', 'notes', 'favorites', 'shared', 'search'].indexOf(view.name) < 0;
    content.replaceChildren(buildView());
    var av = $('#avatar'); if (av) av.textContent = initials(me().name);
    closeNav();
    if (scroll) window.scrollTo(0, 0);
  }

  /* ---------- shared view pieces ---------- */
  function rowFor(n, showOwner) {
    var c = cIdx(n.subject);
    var by = n.owner !== session;
    return h('div', { class: 'row' },
      h('button', { class: 'row-main', type: 'button', onclick: function () { go('note', { id: n.id }); } },
        h('span', { class: 'tile c' + c }, icon('file', 19)),
        h('span', null,
          h('span', { class: 'row-title' }, n.title),
          h('span', { class: 'row-meta', style: 'display:flex' },
            h('span', { class: 'pill c' + c }, n.subject),
            by ? h('span', null, 'by ' + ownerName(n)) : null,
            h('span', { class: 'd-narrow' }, fmt(n.date)))),
        h('span', { class: 'row-date d-wide' }, fmt(n.date))),
      h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Share ' + n.title, onclick: function () { go('note', { id: n.id, focusShare: true }); } }, icon('share', 17)),
      favButton(n));
  }
  function favButton(n) {
    var f = isFav(n);
    return h('button', { class: 'iconbtn' + (f ? ' fav' : ''), type: 'button', 'aria-pressed': String(f), 'aria-label': f ? 'Remove from favorites' : 'Add to favorites', onclick: function () {
      if (f) n.favoriteBy = n.favoriteBy.filter(function (x) { return x !== session; });
      else n.favoriteBy.push(session);
      save(); paint(false);
    } }, icon('star', 17));
  }
  function empty(title, text, btnLabel, onclick) {
    return h('div', { class: 'empty' }, h('h3', null, title), h('p', null, text),
      btnLabel ? h('button', { class: 'btn btn-primary', type: 'button', onclick: onclick }, icon('plus', 16), btnLabel) : null);
  }
  function head(title, sub) {
    return h('div', { class: 'page-head' }, h('div', null, h('h1', null, title), sub ? h('p', null, sub) : null));
  }
  function listOf(arr, emptyEl) {
    return arr.length ? h('div', { class: 'list' }, arr.map(function (n) { return rowFor(n); })) : emptyEl;
  }

  /* ---------- views ---------- */
  function buildView() {
    switch (view.name) {
      case 'notes': return viewNotes();
      case 'shared': return viewShared();
      case 'favorites': return viewFavorites();
      case 'add': return viewForm();
      case 'note': return viewNote();
      case 'search': return viewSearch();
      case 'settings': return viewSettings();
      default: return viewDashboard();
    }
  }

  function stat(ico, label, num, cls, onclick) {
    return h('button', { class: 'stat ' + cls, type: 'button', onclick: onclick },
      h('span', { class: 'ico' }, icon(ico, 18)), h('span', { class: 'lbl' }, label), h('span', { class: 'num' }, String(num)));
  }
  function viewDashboard() {
    var m = mine();
    var shared = m.filter(function (n) { return n.shareable; }).length;
    var favs = accessible().filter(isFav).length;
    var recent = m.slice().sort(byDate).slice(0, 4);
    return h('div', { class: 'page' },
      h('h1', { class: 'greet' }, 'Hello, ' + first() + '! 👋'),
      h('p', { class: 'sub' }, 'Keep your notes safe and accessible anytime.'),
      h('div', { class: 'stats' },
        stat('file', 'Total Notes', m.length, 's-blue', function () { navTo('notes'); }),
        stat('users', 'Shared Notes', shared, 's-green', function () { navTo('notes', { f: 'shared' }); }),
        stat('star', 'Favorites', favs, 's-red', function () { navTo('favorites'); })),
      h('div', { class: 'sec-head' }, h('h2', null, 'Recent Notes'), h('button', { class: 'link', type: 'button', onclick: function () { navTo('notes'); } }, 'View All')),
      listOf(recent, empty('No notes yet', 'Add your first note to start building your library.', 'Add a note', function () { go('add'); })));
  }

  function viewNotes() {
    var m = mine().sort(byDate);
    var f = view.f || 'all';
    var subjects = [];
    m.forEach(function (n) { if (subjects.indexOf(n.subject) < 0) subjects.push(n.subject); });
    var opts = [['all', 'All'], ['shared', 'Shared by me']].concat(subjects.map(function (s) { return [s, s]; }));
    var shown = m.filter(function (n) {
      if (f === 'all') return true;
      if (f === 'shared') return n.shareable;
      return n.subject === f;
    });
    return h('div', { class: 'page' },
      head('My Notes', m.length + (m.length === 1 ? ' note' : ' notes')),
      m.length ? h('div', { class: 'chips', role: 'group', 'aria-label': 'Filter notes' }, opts.map(function (o) {
        return h('button', { class: 'chip', type: 'button', 'aria-pressed': String(f === o[0]), onclick: function () { view.f = o[0]; paint(false); } }, o[1]);
      })) : null,
      listOf(shown, empty(m.length ? 'Nothing in this filter' : 'No notes yet',
        m.length ? 'Pick another filter to see your other notes.' : 'Add your first note to start building your library.',
        m.length ? null : 'Add a note', function () { go('add'); })));
  }

  function viewShared() {
    return h('div', { class: 'page' },
      head('Shared with Me', 'Notes your classmates made available to you'),
      listOf(sharedWithMe().sort(byDate), empty('Nothing shared with you yet',
        'When a classmate shares a note with your email address (' + session + '), it shows up here.')));
  }

  function viewFavorites() {
    return h('div', { class: 'page' },
      head('Favorites', 'Your starred notes'),
      listOf(accessible().filter(isFav).sort(byDate), empty('No favorites yet', 'Tap the star on any note to keep it here.')));
  }

  function viewSearch() {
    var q = (view.q || '').toLowerCase();
    var res = accessible().filter(function (n) {
      return (n.title + ' ' + n.subject + ' ' + n.desc).toLowerCase().indexOf(q) > -1;
    }).sort(byDate);
    return h('div', { class: 'page' },
      head('Search Results (' + res.length + ')', 'Matching “' + view.q + '” in your notes and notes shared with you'),
      listOf(res, empty('No notes match', 'Try a different word, or search by subject such as Java or Networking.')));
  }

  function viewForm() {
    var editing = view.id ? notes.filter(function (n) { return n.id === view.id && n.owner === session; })[0] : null;
    var st = { shareable: editing ? editing.shareable : false };
    var title = h('input', { class: 'input', id: 'f-title', type: 'text', placeholder: 'Enter note title', maxlength: '120', value: editing ? editing.title : '' });
    var subject = h('select', { class: 'select', id: 'f-subject' },
      h('option', { value: '' }, 'Select subject'),
      SUBJECTS.map(function (s) { return h('option', { value: s[0], selected: !!editing && editing.subject === s[0] }, s[0]); }));
    var desc = h('textarea', { class: 'textarea', id: 'f-desc', placeholder: 'Write your notes here...', maxlength: '5000' }, editing ? editing.desc : '');
    var counter = h('span', { class: 'counter', 'aria-live': 'off' }, desc.value.length + '/5000');
    desc.addEventListener('input', function () { counter.textContent = desc.value.length + '/5000'; });
    var mT = h('span', { class: 'field-msg', role: 'alert' });
    var mS = h('span', { class: 'field-msg', role: 'alert' });
    var mD = h('span', { class: 'field-msg', role: 'alert' });
    var sw = h('button', { class: 'switch', type: 'button', role: 'switch', id: 'f-share', 'aria-checked': String(st.shareable), 'aria-labelledby': 'f-share-l', onclick: function () {
      st.shareable = !st.shareable; sw.setAttribute('aria-checked', String(st.shareable));
    } });
    function check(el, msgEl, ok, text) {
      msgEl.textContent = ok ? '' : text;
      if (ok) el.removeAttribute('aria-invalid'); else el.setAttribute('aria-invalid', 'true');
      return ok;
    }
    var form = h('form', { class: 'card form-card stack', novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      var t = title.value.trim(), d = desc.value.trim();
      var ok = check(title, mT, !!t, 'Enter a title.');
      ok = check(subject, mS, !!subject.value, 'Choose a subject.') && ok;
      ok = check(desc, mD, !!d, 'Write something in the description.') && ok;
      if (!ok) return;
      var saved;
      if (editing) {
        Object.assign(editing, { title: t, subject: subject.value, desc: d, shareable: st.shareable });
        saved = editing;
      } else {
        saved = mk(newId(), session, t, subject.value, new Date().toISOString(), st.shareable, [], [], d);
        notes.push(saved);
      }
      save();
      toast(editing ? 'Note updated.' : 'Note saved.');
      stack = [];
      view = { name: 'note', id: saved.id };
      paint(true);
    } },
      field('Title', title, mT, true),
      field('Subject', subject, mS, true),
      h('div', { class: 'field' },
        h('label', { class: 'label', for: 'f-desc' }, 'Description', h('span', { class: 'req' }, ' *')), desc, counter, mD),
      h('div', { class: 'switch-row' }, h('span', { id: 'f-share-l' }, 'Make this note available for sharing'), sw),
      h('div', { class: 'actions' },
        h('button', { class: 'btn btn-primary', type: 'submit', style: 'min-width:140px' }, editing ? 'Save Changes' : 'Save Note'),
        h('button', { class: 'btn', type: 'button', style: 'min-width:120px', onclick: function () { if (stack.length) back(); else navTo('dashboard'); } }, 'Cancel')));
    return h('div', { class: 'page' },
      h('div', { class: 'note-bar' },
        h('button', { class: 'back', type: 'button', onclick: function () { if (stack.length) back(); else navTo('dashboard'); } }, icon('back', 18), editing ? 'Edit Note' : 'Add New Note')),
      form);
  }

  function viewNote() {
    var n = notes.filter(function (x) { return x.id === view.id; })[0];
    if (!canView(n)) {
      return h('div', { class: 'page' }, h('div', { class: 'note-bar' }, h('button', { class: 'back', type: 'button', onclick: back }, icon('back', 18), 'Back')),
        empty('Note not available', 'This note was deleted or is not shared with you.'));
    }
    var own = n.owner === session;
    var c = cIdx(n.subject);

    var menu = null;
    if (own) {
      menu = h('div', { class: 'menu-wrap' },
        h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'More actions', 'aria-haspopup': 'menu', 'aria-expanded': String(menuOpen), onclick: function (e) {
          e.stopPropagation(); menuOpen = !menuOpen; paint(false);
        } }, icon('more', 18)),
        menuOpen ? h('div', { class: 'menu', role: 'menu' },
          h('button', { type: 'button', role: 'menuitem', onclick: function () { go('add', { id: n.id }); } }, icon('edit', 16), 'Edit note'),
          h('button', { type: 'button', role: 'menuitem', class: 'danger', onclick: function () { menuOpen = false; confirmDelete = true; paint(false); } }, icon('trash', 16), 'Delete note')) : null);
    }

    var bar = h('div', { class: 'note-bar' },
      h('button', { class: 'back', type: 'button', onclick: back }, icon('back', 18), 'Back'),
      favButton(n),
      h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Go to sharing options', onclick: function () {
        var s = $('#share'); if (s) { s.scrollIntoView({ behavior: 'smooth', block: 'center' }); var i = $('#share-link'); if (i) i.focus({ preventScroll: true }); }
      } }, icon('share', 18)),
      menu);

    var del = confirmDelete ? h('div', { class: 'confirm', role: 'alert' }, 'Delete this note? This cannot be undone.',
      h('span', { class: 'actions' },
        h('button', { class: 'btn btn-danger', type: 'button', onclick: function () {
          notes = notes.filter(function (x) { return x.id !== n.id; });
          save(); confirmDelete = false; toast('Note deleted.'); stack = []; navTo('notes');
        } }, 'Delete'),
        h('button', { class: 'btn', type: 'button', onclick: function () { confirmDelete = false; paint(false); } }, 'Keep'))) : null;

    var card = h('article', { class: 'card' },
      h('span', { class: 'pill c' + c }, n.subject),
      h('h1', { class: 'note-title' }, n.title),
      h('div', { class: 'note-meta' },
        h('span', null, icon('calendar', 15), fmt(n.date)),
        h('span', null, icon(n.shareable ? 'users' : 'lock', 15), n.shareable ? 'Shared' : 'Private'),
        own ? null : h('span', null, icon('user', 15), 'by ' + ownerName(n))),
      h('div', { class: 'note-body' }, n.desc),
      del);

    return h('div', { class: 'page' }, bar, card, sharePanel(n, own));
  }

  function sharePanel(n, own) {
    var link = h('input', { class: 'input', id: 'share-link', type: 'text', readonly: true, value: noteLink(n), 'aria-label': 'Note link' });
    var copy = h('button', { class: 'btn', type: 'button', onclick: function () {
      var done = function () { toast('Link copied.'); };
      var fail = function () { link.focus(); link.select(); toast('Select the link and copy it with Ctrl+C.'); };
      try { navigator.clipboard.writeText(link.value).then(done, fail); } catch (e) { fail(); }
    } }, icon('copy', 16), 'Copy');

    var parts = [h('h3', null, 'Share this note')];
    if (!n.shareable && own) {
      parts.push(h('p', { class: 'share-note' }, 'Sharing is off for this note, so the link and classmates cannot open it.'));
      parts.push(h('button', { class: 'btn btn-primary', type: 'button', onclick: function () { n.shareable = true; save(); paint(false); } }, 'Turn on sharing'));
      return h('section', { class: 'card share', id: 'share' }, parts);
    }
    parts.push(h('div', { class: 'share line' }, link, copy));
    if (!own) return h('section', { class: 'card share', id: 'share' }, parts);

    var err = h('span', { class: 'field-msg', role: 'alert' });
    var who = h('input', { class: 'input', id: 'share-who', type: 'text', placeholder: 'Enter email or user ID', autocomplete: 'off', 'aria-label': 'Classmate email or user ID' });
    function send() {
      var q = who.value.trim().toLowerCase();
      var email;
      err.textContent = '';
      if (!q) { err.textContent = 'Enter an email or user ID.'; return; }
      if (q.indexOf('@') > -1) {
        if (!/^\S+@\S+\.\S+$/.test(q)) { err.textContent = 'That email address does not look right.'; return; }
        email = q;
      } else {
        var u = Object.keys(users).map(function (k) { return users[k]; }).filter(function (x) { return x.id === q; })[0];
        if (!u) { err.textContent = 'No classmate has that user ID. Try their email instead.'; return; }
        email = u.email;
      }
      if (email === n.owner) { err.textContent = 'That is your own account.'; return; }
      if (n.sharedWith.indexOf(email) > -1) { err.textContent = 'Already shared with them.'; return; }
      n.sharedWith.push(email); save();
      toast(users[email] ? 'Shared with ' + users[email].name + '.' : 'Shared. ' + email + ' will see it after signing up with that email.');
      paint(false);
    }
    who.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); send(); } });
    var people = n.sharedWith.length ? h('div', { class: 'people' }, n.sharedWith.map(function (em) {
      var label = users[em] ? users[em].name : em;
      return h('span', { class: 'person' }, label,
        h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Stop sharing with ' + label, onclick: function () {
          n.sharedWith = n.sharedWith.filter(function (x) { return x !== em; }); save(); paint(false);
        } }, icon('x', 14)));
    })) : null;
    parts.push(h('div', { style: 'margin-top:20px' },
      h('h3', null, 'Share with classmates'),
      h('div', { class: 'share line' }, who, h('button', { class: 'btn btn-primary', type: 'button', style: 'min-width:92px', onclick: send }, 'Send')),
      err, people));
    return h('section', { class: 'card share', id: 'share' }, parts);
  }

  function viewSettings() {
    var u = me();
    var nm = h('input', { class: 'input', id: 's-name', type: 'text', value: u.name, maxlength: '60', 'aria-label': 'Display name' });
    var nmMsg = h('span', { class: 'field-msg', role: 'alert' });
    var sel = h('select', { class: 'select', id: 's-theme', 'aria-label': 'Theme', onchange: function () {
      theme = sel.value; store('cn_theme', theme); applyTheme();
    } },
      [['system', 'Match device'], ['light', 'Light'], ['dark', 'Dark']].map(function (o) { return h('option', { value: o[0], selected: theme === o[0] }, o[1]); }));
    var wipe = h('div', { class: 'settings-row' });
    function wipeIdle() {
      wipe.replaceChildren(
        h('div', null, h('strong', null, 'Delete all my notes'), h('p', null, 'Removes the ' + mine().length + ' notes you own from this browser.')),
        h('button', { class: 'btn', type: 'button', disabled: mine().length === 0, onclick: wipeAsk }, 'Delete all'));
    }
    function wipeAsk() {
      wipe.replaceChildren(
        h('div', { class: 'confirm', style: 'width:100%;margin:0', role: 'alert' }, 'Delete all ' + mine().length + ' of your notes? This cannot be undone.',
          h('span', { class: 'actions' },
            h('button', { class: 'btn btn-danger', type: 'button', onclick: function () {
              notes = notes.filter(function (x) { return x.owner !== session; }); save(); toast('All your notes were deleted.'); paint(false);
            } }, 'Delete all'),
            h('button', { class: 'btn', type: 'button', onclick: wipeIdle }, 'Keep'))));
    }
    wipeIdle();
    return h('div', { class: 'page' },
      head('Settings', u.email),
      h('section', { class: 'card stack' },
        h('h2', { style: 'font-size:16px' }, 'Profile'),
        h('div', { class: 'settings-row' },
          h('div', { style: 'flex:1;min-width:200px' }, h('label', { class: 'label', for: 's-name' }, 'Display name'), nm, nmMsg),
          h('button', { class: 'btn btn-primary', type: 'button', style: 'align-self:flex-end', onclick: function () {
            var v = nm.value.trim();
            if (!v) { nmMsg.textContent = 'Name cannot be empty.'; return; }
            nmMsg.textContent = ''; u.name = v; save(); toast('Name updated.'); paint(false);
          } }, 'Save name'))),
      h('section', { class: 'card stack' },
        h('h2', { style: 'font-size:16px' }, 'Appearance'),
        h('div', { class: 'settings-row' }, h('div', null, h('strong', null, 'Theme'), h('p', null, 'Choose light, dark, or follow your device.')), sel)),
      h('section', { class: 'card stack' },
        h('h2', { style: 'font-size:16px' }, 'Your data'),
        wipe,
        h('p', { class: 'hint', style: 'text-align:left' }, 'Accounts and notes are saved in this browser only. Your user ID for sharing is “' + u.id + '”.')),
      h('div', null, h('button', { class: 'btn', type: 'button', onclick: logout }, icon('logout', 16), 'Log out')));
  }

  /* ---------- global events ---------- */
  document.addEventListener('click', function (e) {
    if (menuOpen && !e.target.closest('.menu-wrap')) { menuOpen = false; if (content) paint(false); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeNav();
      if (menuOpen) { menuOpen = false; if (content) paint(false); }
    }
  });

  /* ---------- boot ---------- */
  function render() {
    applyTheme();
    if (session && users[session]) renderShell();
    else { session = null; renderAuth(); }
  }
  render();
  if (session && pendingHash) {
    var target = notes.filter(function (x) { return x.id === pendingHash[1]; })[0];
    pendingHash = null;
    if (canView(target)) go('note', { id: target.id });
  }
})();
</script>
</body>
</html>
